# ╔══════════════════════════════════════════════════════════════════════════╗
# ║  vision_engine — Smoke Test Config (3 epochs, imgsz=320, batch=4)       ║
# ║  Purpose: validate the full training pipeline before full 50-ep run     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

# ─── Dataset (same validated combined dataset) ───────────────────────────────
data: "C:\\RAG Final project\\vision_engine\\datasets\\combined_circuit_dataset\\data.yaml"

# ─── Model (local weights — no download) ────────────────────────────────────
model: "C:\\RAG Final project\\vision_engine\\models\\yolov8n.pt"
task:  detect

# ─── Smoke-test hyper-parameters ────────────────────────────────────────────
epochs:        3           # smoke only — do NOT increase without approval
batch:         4           # half of full config to reduce memory pressure
imgsz:         320         # half resolution — much faster on CPU
workers:       2           # low to avoid multiprocessing issues on Windows
patience:      3           # irrelevant at 3 epochs but required param
save_period:   1           # save checkpoint every epoch for inspection

# ─── Optimiser (same as full config) ────────────────────────────────────────
optimizer:    SGD
lr0:          0.01
lrf:          0.01
momentum:     0.937
weight_decay: 0.0005
warmup_epochs: 3.0         # all 3 epochs are warmup — intentional for smoke test
warmup_momentum: 0.8

# ─── Augmentation (same as full config) ─────────────────────────────────────
hsv_h:     0.015
hsv_s:     0.7
hsv_v:     0.4
degrees:   0.0
translate: 0.1
scale:     0.5
shear:     0.0
perspective: 0.0
flipud:    0.0
fliplr:    0.5
mosaic:    1.0
mixup:     0.0

# ─── Device ─────────────────────────────────────────────────────────────────
device: cpu

# ─── Output (distinct name — will NOT overwrite any previous run) ────────────
project: "C:\\RAG Final project\\vision_engine\\outputs\\runs"
name:    yolov8n_smoke_320_3ep    # unique name — Ultralytics auto-increments if rerun

# ─── Validation & plots ──────────────────────────────────────────────────────
val:   true
plots: true
