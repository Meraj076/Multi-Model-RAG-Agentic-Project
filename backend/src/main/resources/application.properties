# Application Name and Server Configuration
spring.application.name=blueprint-analysis-service
server.port=${PORT:8080}

# File Upload Constraints
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blueprint_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local File Storage Configuration (Relative path for cross-machine portability)
storage.upload-dir=./data/uploads
storage.allowed-content-types=application/pdf,image/png,image/jpeg,image/jpg

# Python ML Microservice Configuration
# Can be overridden via system environment variable ML_SERVICE_URL (e.g., https://blueprint-ml-service.onrender.com)
ml.service.base-url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.connect-timeout-ms=${ML_SERVICE_CONNECT_TIMEOUT_MS:60000}
ml.service.read-timeout-ms=${ML_SERVICE_READ_TIMEOUT_MS:90000}

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
