spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test storage directory
storage.upload-dir=./data/test-uploads
storage.allowed-content-types=application/pdf,image/png,image/jpeg,image/jpg

# Mock ML Service settings
ml.service.base-url=http://localhost:8000
ml.service.connect-timeout-ms=1000
ml.service.read-timeout-ms=2000
