# Application Name and Server Configuration
spring.application.name=blueprint-analysis-service
server.port=8080

# File Upload Constraints
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blueprint_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Meraj@12345}

# JPA / Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Local File Storage Configuration (Relative path for cross-machine portability)
storage.upload-dir=./data/uploads
storage.allowed-content-types=application/pdf,image/png,image/jpeg,image/jpg

# Python ML Microservice Configuration
# Can be overridden via system environment variable ML_SERVICE_URL (e.g., http://192.168.1.50:8000)
ml.service.base-url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.connect-timeout-ms=3000
ml.service.read-timeout-ms=15000
